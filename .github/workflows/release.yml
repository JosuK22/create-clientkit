name: Release

# Stages a release to npm with provenance, using trusted publishing (OIDC)
# rather than a long-lived npm token. Nothing here reads a secret, and nothing
# here goes live: the last step is a human approving the staged version.
#
# Two things must be true before this can succeed, and neither can be done
# from a workflow file:
#   1. The npm account exists, has 2FA, and `create-clientkit` is claimed by it.
#   2. Trusted publishing is configured for the package on npmjs.com, linking
#      it to this repository and this workflow file.
#
# Until then this workflow will fail at the publish step, which is the correct
# behaviour: it must not fall back to a token.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance

env:
  PUPPETEER_SKIP_DOWNLOAD: 'false'

jobs:
  release:
    name: preflight and publish
    runs-on: ubuntu-latest
    steps:
      # Checks out the exact tagged commit, not a moving branch.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install deterministically
        run: npm ci

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # The same gate a developer runs locally: typecheck, lint, format,
      # notices, tests, build, package contents, clean-room smoke and audit.
      #
      # A complete pass stamps the shasum of the tarball npm would produce.
      # The publish step below fires `prepublishOnly`, which consults that
      # stamp and skips only if the bytes are byte-for-byte the ones verified
      # here - so the gates run once per release instead of twice, without any
      # of them being skippable. See scripts/preflight.mjs.
      - name: Release preflight
        run: npm run preflight

      - name: Pack
        run: npm pack

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: create-clientkit-tarball
          path: '*.tgz'
          retention-days: 30

      # `npm stage publish`, not `npm publish`. The trusted publisher is
      # configured for staged publishing only, so CI can prepare a release but
      # cannot make one live: a human approves it with 2FA, after npm's malware
      # scan has run. Staging is always permitted for a trusted publisher, so
      # this step is correct whether or not direct publish is also enabled.
      #
      # --provenance stays explicit even though trusted publishing generates
      # attestations automatically. With the flag, npm fails rather than
      # quietly staging a build that carries no provenance - which would defeat
      # the point of publishing from CI at all.
      - name: Stage the release with provenance
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm stage publish --access public --provenance

      - name: Report
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true }}" = "true" ]; then
            echo "### Staged create-clientkit@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Not live yet. Approve it to publish:" >> "$GITHUB_STEP_SUMMARY"
            echo '```sh' >> "$GITHUB_STEP_SUMMARY"
            echo "npm stage list create-clientkit" >> "$GITHUB_STEP_SUMMARY"
            echo "npm stage approve <stage-id>   # prompts for 2FA" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Or npmjs.com -> create-clientkit -> Staged Packages." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Dry run for create-clientkit@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "All gates ran; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi
