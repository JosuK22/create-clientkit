name: Release

# Publishes to npm with provenance, using trusted publishing (OIDC) rather
# than a long-lived npm token. Nothing here reads a secret.
#
# Two things must be true before this can succeed, and neither can be done
# from a workflow file:
#   1. The npm account exists, has 2FA, and `create-clientkit` is claimed by it.
#   2. Trusted publishing is configured for the package on npmjs.com, linking
#      it to this repository and this workflow file.
#
# Until then this workflow will fail at the publish step, which is the correct
# behaviour: it must not fall back to a token.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance

env:
  PUPPETEER_SKIP_DOWNLOAD: 'false'

jobs:
  release:
    name: preflight and publish
    runs-on: ubuntu-latest
    steps:
      # Checks out the exact tagged commit, not a moving branch.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install deterministically
        run: npm ci

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # The same gate a developer runs locally: typecheck, lint, format,
      # notices, tests, build, package contents, clean-room smoke and audit.
      - name: Release preflight
        run: npm run preflight

      - name: Pack
        run: npm pack

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: create-clientkit-tarball
          path: '*.tgz'
          retention-days: 30

      - name: Publish with provenance
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish --access public --provenance

      - name: Report
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true }}" = "true" ]; then
            echo "### Published create-clientkit@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/create-clientkit/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Dry run for create-clientkit@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "All gates ran; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi
