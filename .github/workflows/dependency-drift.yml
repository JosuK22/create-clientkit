name: Dependency drift

# The generated template pins Astro, Tailwind, TypeScript and the sitemap
# integration to exact versions, which is what makes generation reproducible.
# This job answers a different question: would the template still work if those
# pins were moved to today's latest?
#
# It never modifies the pins. It probes, and reports.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  probe:
    name: probe latest ecosystem versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Report currently pinned versions
        run: node scripts/drift-probe.mjs --report

      - name: Generate a project and upgrade it to the latest versions
        id: probe
        run: node scripts/drift-probe.mjs

      - name: Open an issue when the probe fails
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Dependency drift: the template no longer builds on latest';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            // Reuse an existing open report rather than filing a new one weekly.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-drift',
            });

            const body = [
              'The scheduled dependency-drift probe failed.',
              '',
              'The template still builds with its pinned versions - this job does',
              'not change them. It reports that upgrading to the latest compatible',
              'versions would currently break generation, `astro check` or the build.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dependency-drift'],
              });
            }

  # The probe job above short-circuits whenever every pin is current or held,
  # which is most weeks - so its interesting path (drift detected, project
  # upgraded, rebuilt) can sit unexecuted for months and then fail on the one
  # morning it is needed.
  #
  # This job exercises that path deliberately, by overriding what the probe
  # believes "latest" to be for a single package. No pin is changed and nothing
  # is published; it is a self-test of the machinery.
  #
  # It is a separate job on purpose: a failure here means the probe script
  # broke, not that the ecosystem moved, and it must not file the drift issue
  # above.
  selftest:
    name: self-test the drift probe path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Exercise the drift-detected branch against a simulated version
        run: npm run drift:selftest

      - name: Confirm the simulation changed no pin
        run: |
          if ! git diff --quiet -- templates/; then
            echo "::error::the drift self-test modified the template - it must never do that"
            git --no-pager diff -- templates/
            exit 1
          fi
          echo "template pins unchanged, as required"
