<!--
  The JSON-LD block from dist/index.html of a real `astro build`.

  Not hand-written and not reformatted - test/fixtures/ is in .prettierignore
  so this stays exactly what Astro emitted for the site metadata named in
  test/structured-data.test.ts.

  The Organization contract the feature computes is parsed and compared
  against this, so the generic model and the framework implementation cannot
  drift apart unnoticed. scripts/smoke.mjs re-parses the same block from a
  freshly built project on every CI run.
-->
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Acme Ltd","url":"https://acme.example","description":"Bespoke widgets for discerning clients."}</script>
